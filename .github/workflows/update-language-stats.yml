name: Private Language Stats
on: 
  push: { branches: [ main ] }
  workflow_dispatch: {}

jobs:
  track-languages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Auth and clone private repos
        env:
          PAT: ${{ secrets.PAT }}
        run: |
          git config --global url."https://$PAT@github.com".insteadOf "https://github.com"
          gh auth login --with-token <<< "$PAT"
          gh repo list --limit 50 --json nameWithOwner --jq '.[].nameWithOwner' | xargs -I {} gh repo clone {} || true
          
      - name: Run linguist analysis
        run: |
          sudo apt-get install -y cmake libicu-dev
          gem install github-linguist
          github-linguist --json --no-ansi > linguist.json
          jq -r 'to_entries[] | "\(.key): \(.value)%"' linguist.json > languages.txt
          
      - name: Update README
        run: |
          LANG_STATS=$(cat languages.txt | head -5)
          sed -i '/<!-- LANG_START -->/,/<!-- LANG_END -->/c<!-- LANG_START -->\n### Private Code Distribution\n${LANG_STATS}\n<!-- LANG_END -->' README.md